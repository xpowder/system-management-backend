[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# Same script as Dockerfile CMD. /bin/sh expands $PORT inside start.sh.
# Do not replace this with migrate-only or createsuperuser.
startCommand = "/bin/sh /app/start.sh"
healthcheckPath = "/healthz"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
