[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# Docker images need a shell so $PORT expands inside start.sh.
# Form required by Railway: /bin/sh -c "..."
# This also overrides a dashboard Start Command such as createsuperuser.
startCommand = "/bin/sh -c 'exec /app/start.sh'"
healthcheckPath = "/healthz"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
