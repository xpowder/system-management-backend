[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# Must match Docker CMD. /bin/sh -c is required for Dockerfile services.
# Do not set a dashboard Start Command (createsuperuser / migrate-only).
startCommand = "/bin/sh -c 'exec /app/start.sh'"
healthcheckPath = "/healthz"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
